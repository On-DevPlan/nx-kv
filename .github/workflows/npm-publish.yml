name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write   # 写 tag 需要；不要省
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets 不能直接出现在 if 里（GitHub 限制，写了会让整个 workflow 无法创建），
    # 所以先转发到 env，再用 env 判断。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # 必须 0，tag 检测需要完整历史
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Smoke test
        run: pnpm test

      - name: Get version and package name
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 未配置密钥时跳过，而不是把 CI 跑成红的 ——
      # 缺密钥是「还没配」，不是「代码坏了」，两者不该长得一样。
      - name: 未配置 NPM_TOKEN 时跳过发布
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::未配置 NPM_TOKEN，跳过标签与发布。配置后 push 即自动发版。"

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false' && env.HAS_NPM_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: Check if version exists on npm
        id: npm_check
        run: |
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.npm_check.outputs.published == 'false' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
